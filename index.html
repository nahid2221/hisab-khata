<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হিসাব খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --spine:#7E1D34; --spine-dark:#5E1526;
    --rule:#D9A6AC; --rule-soft:#EAD3D6; --ink:#241E1C; --ink-soft:#6B615C;
    --brass:#A9762F; --ok:#2F6B4F; --danger:#B23B3B; --warn:#B8860B;
  }
  body.dark{
    --paper:#241E1C; --spine:#4A1420; --spine-dark:#2E0D14;
    --rule:#5A3A3E; --rule-soft:#3A2C2C; --ink:#F0E8E2; --ink-soft:#B8ACA4;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Hind Siliguri',sans-serif; background:var(--spine-dark); color:var(--ink); min-height:100vh; display:flex; justify-content:center;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}}
  .book{width:100%; max-width:520px; background:var(--spine); min-height:100vh; position:relative; box-shadow:0 0 40px rgba(0,0,0,0.4); overflow:hidden;}
  .view{display:none;} .view.open{display:block;}

  /* HOME */
  .cover{padding:36px 20px 20px 24px; color:var(--paper); min-height:100vh; position:relative;}
  .topbtns{position:absolute; top:32px; right:20px; display:flex; gap:8px;}
  .iconbtn{width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.08); color:var(--paper); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;}
  .iconbtn:active{transform:scale(0.94);}
  .cover .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.14em; opacity:0.65; text-transform:uppercase;}
  .cover h1{font-family:'Baloo Da 2',sans-serif; font-size:34px; margin:4px 0 16px;}

  .summary{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); border-radius:12px; padding:14px 16px; margin-bottom:18px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .summary .cell .lbl{font-size:11px; opacity:0.7;}
  .summary .cell .val{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; margin-top:2px;}
  .summary .cell.net .val.pos{color:#8FD9AE;} .summary .cell.net .val.neg{color:#F3A6A6;}

  .settings{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:12px; padding:14px 16px; margin-bottom:18px; display:none; color:var(--paper);}
  .settings.open{display:block;}
  .settings label{display:block; font-size:12px; opacity:0.7; margin-bottom:6px;}
  .settings input[type=text]{width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,0.25); font-family:'JetBrains Mono',monospace; font-size:12px; background:rgba(0,0,0,0.15); color:var(--paper);}
  .settings .row{display:flex; justify-content:space-between; align-items:center; margin-top:12px;}
  .settings .hint{font-size:11px; opacity:0.6; margin-top:8px; line-height:1.5;}
  .settings .status{margin-top:10px; font-size:12px; font-weight:600;}
  .status.ok{color:#8FD9AE;} .status.off{color:rgba(255,255,255,0.6);}
  .toggle{width:42px; height:24px; border-radius:12px; background:rgba(255,255,255,0.2); position:relative; cursor:pointer; border:none;}
  .toggle.on{background:#8FD9AE;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left 0.15s;}
  .toggle.on::after{left:20px;}

  .tabs{display:flex; flex-direction:column; gap:12px;}
  .tab{display:flex; align-items:center; gap:14px; background:var(--paper); border-radius:10px 4px 4px 10px; padding:14px 16px 14px 18px; cursor:pointer; position:relative; box-shadow:2px 3px 0 rgba(0,0,0,0.15); border:none; width:100%; text-align:right;}
  .tab:active{transform:translateX(2px);}
  .tab .swatch{width:8px; align-self:stretch; border-radius:4px; flex-shrink:0;}
  .tab .info{flex:1; text-align:right; min-width:0;}
  .tab .name{font-weight:700; font-size:16px; color:var(--ink); display:block;}
  .tab .desc{font-size:11.5px; color:var(--ink-soft); display:block; margin-top:2px;}
  .tab .budgetbar{height:5px; border-radius:3px; background:var(--rule-soft); margin-top:6px; overflow:hidden;}
  .tab .budgetbar > div{height:100%; background:var(--ok);}
  .tab .budgetbar.over > div{background:var(--danger);}
  .tab .sum{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; min-width:66px; text-align:left; color:var(--ink);}
  .addcat{margin-top:4px; background:rgba(255,255,255,0.08); border:1px dashed rgba(255,255,255,0.35); color:var(--paper); border-radius:10px; padding:14px; font-size:14px; cursor:pointer;}

  /* MANAGE CATEGORIES */
  .subhead{padding:22px 20px 16px; color:var(--paper); display:flex; align-items:center; gap:12px;}
  .subhead h2{font-family:'Baloo Da 2',sans-serif; font-size:22px; margin:0; flex:1;}
  .mpage{background:var(--paper); border-radius:18px 18px 0 0; min-height:calc(100vh - 90px); padding:20px;}
  .catrow{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--rule-soft);}
  .catrow .sw{width:16px; height:16px; border-radius:50%; flex-shrink:0;}
  .catrow .nm{flex:1; font-weight:600; font-size:14.5px;}
  .catrow .bud{font-size:11.5px; color:var(--ink-soft);}
  .delbtn{background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; padding:4px 8px;}
  .newcatform{margin-top:18px; display:grid; gap:10px;}
  .newcatform input{width:100%; padding:11px 12px; border:none; border-bottom:2px solid var(--rule); background:transparent; font-family:'Hind Siliguri',sans-serif; font-size:15px; color:var(--ink); outline:none;}
  .colors{display:flex; gap:8px; flex-wrap:wrap;}
  .colordot{width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .colordot.sel{border-color:var(--ink);}

  /* CATEGORY PAGE */
  .cathead{padding:22px 20px 12px; color:var(--paper); display:flex; align-items:center; gap:12px;}
  .backBtn{width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.08); color:var(--paper); font-size:18px; cursor:pointer; flex-shrink:0;}
  .cathead .titles{flex:1; min-width:0;}
  .cathead h2{font-family:'Baloo Da 2',sans-serif; font-size:21px; margin:0;}
  .cathead .sub{font-size:11.5px; opacity:0.7;}
  .budgetinfo{padding:0 20px 14px; color:var(--paper);}
  .budgetinfo .bar{height:7px; border-radius:4px; background:rgba(255,255,255,0.2); overflow:hidden; margin-top:6px;}
  .budgetinfo .bar>div{height:100%; background:#8FD9AE;}
  .budgetinfo .bar.over>div{background:#F3A6A6;}
  .budgetinfo .txt{font-size:11.5px; margin-top:4px; opacity:0.85;}
  .budgetinfo .warn{color:#F3A6A6; font-weight:700;}

  .page{background:var(--paper); border-radius:18px 18px 0 0; min-height:calc(100vh - 90px); position:relative; padding:20px 20px 100px 34px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 43px, var(--rule-soft) 43px, var(--rule-soft) 44px); background-position:0 96px;}
  .page::before{content:""; position:absolute; left:22px; top:0; bottom:0; width:2px; background:var(--rule); opacity:0.7;}
  .page::after{content:""; position:absolute; left:0; top:0; bottom:0; width:14px; background-image:radial-gradient(circle, var(--spine-dark) 3px, transparent 3.2px); background-size:14px 44px; background-position:3px 22px; opacity:0.55;}

  .searchbox{margin-bottom:14px;}
  .searchbox input{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--rule-soft); background:#fff1; font-size:13.5px; color:var(--ink); font-family:'Hind Siliguri',sans-serif;}
  body.dark .searchbox input{background:rgba(255,255,255,0.06);}

  .typetoggle{display:flex; gap:8px; margin-bottom:4px;}
  .typebtn{flex:1; padding:9px; border-radius:8px; border:1px solid var(--rule); background:transparent; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .typebtn.active{background:var(--spine); color:var(--paper); border-color:var(--spine);}

  form{display:grid; gap:12px; margin-bottom:20px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;}
  .field input{width:100%; padding:11px 12px; border:none; border-bottom:2px solid var(--rule); background:transparent; font-family:'Hind Siliguri',sans-serif; font-size:16px; color:var(--ink); outline:none;}
  .field input:focus{border-bottom-color:var(--spine);}
  button.add{background:var(--spine); color:var(--paper); border:none; padding:13px; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; font-family:'Hind Siliguri',sans-serif;}
  button.add:active{transform:scale(0.98);}
  button.cancelEdit{background:none; border:1px solid var(--rule); color:var(--ink-soft); padding:10px; border-radius:10px; font-size:14px; cursor:pointer;}

  .toprow{font-size:11.5px; color:var(--brass); font-weight:700; margin-bottom:10px;}

  .entries{display:flex; flex-direction:column;}
  .entry{display:grid; grid-template-columns:1fr auto auto; align-items:baseline; gap:8px; padding:12px 0; border-bottom:1px dashed var(--rule); animation:write 0.3s ease-out;}
  @keyframes write{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .entry .name{font-weight:600; font-size:14.5px;}
  .entry .name .type-in{color:var(--ok); font-size:11px; margin-left:4px;}
  .entry .qty{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); display:block; margin-top:2px;}
  .entry .amt{font-family:'JetBrains Mono',monospace; font-size:14.5px; font-weight:700; color:var(--ink);}
  .entry .amt.income{color:var(--ok);}
  .entry .actions{display:flex; gap:6px;}
  .entry .actions button{background:none; border:none; font-size:14px; cursor:pointer; color:var(--ink-soft); padding:2px 4px;}
  .entry .sync-mark{grid-column:1/-1; font-size:10px; font-family:'JetBrains Mono',monospace;}
  .sync-mark.ok{color:var(--ok);} .sync-mark.pending{color:var(--ink-soft);} .sync-mark.fail{color:var(--danger);}

  .empty{text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:13px;}
  .grand-total{position:sticky; bottom:0; background:var(--paper); border-top:2px solid var(--spine); margin:0 -20px 0 -34px; padding:14px 20px 18px 34px; display:flex; justify-content:space-between; align-items:center;}
  .grand-total .label{font-size:12.5px; color:var(--ink-soft);}
  .grand-total .value{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--spine);}
</style>
</head>
<body>
<div class="book">

  <!-- HOME -->
  <div class="view open" id="homeView">
    <div class="cover">
      <div class="topbtns">
        <button class="iconbtn" id="darkBtn" aria-label="ডার্ক মোড">🌙</button>
        <button class="iconbtn" id="gearBtn" aria-label="সেটিংস">⚙</button>
      </div>
      <div class="eyebrow">আপনার</div>
      <h1>হিসাব খাতা</h1>

      <div class="summary">
        <div class="cell"><div class="lbl">আজকের খরচ</div><div class="val" id="todayTotal">৳ ০</div></div>
        <div class="cell"><div class="lbl">এই মাসের খরচ</div><div class="val" id="monthTotal">৳ ০</div></div>
        <div class="cell"><div class="lbl">এই মাসের আয়</div><div class="val" id="monthIncome">৳ ০</div></div>
        <div class="cell net"><div class="lbl">নিট সঞ্চয়</div><div class="val" id="netSavings">৳ ০</div></div>
      </div>

      <div class="settings" id="settingsPanel">
        <label for="scriptUrl">Google Apps Script Web App URL</label>
        <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
        <div class="status off" id="syncStatus">● সিঙ্ক বন্ধ আছে</div>
        <div class="hint">এই URL ও আপনার ডাটা এখন থেকে এই ব্রাউজারে সেভ থাকবে, রিফ্রেশ করলে হারাবে না।</div>
      </div>

      <div class="tabs" id="tabsList"></div>
      <button class="addcat" id="addCatBtn">+ ক্যাটাগরি ম্যানেজ করুন</button>
    </div>
  </div>

  <!-- MANAGE CATEGORIES -->
  <div class="view" id="manageView">
    <div class="subhead">
      <button class="backBtn" id="manageBackBtn">←</button>
      <h2>ক্যাটাগরি ম্যানেজ করুন</h2>
    </div>
    <div class="mpage">
      <div id="catList"></div>
      <div class="newcatform">
        <input type="text" id="newCatName" placeholder="নতুন ক্যাটাগরির নাম">
        <input type="number" id="newCatBudget" placeholder="মাসিক বাজেট (ঐচ্ছিক, টাকা)">
        <div class="colors" id="colorPicker"></div>
        <button class="add" id="addCatSubmit">যোগ করুন</button>
      </div>
    </div>
  </div>

  <!-- CATEGORY PAGE -->
  <div class="view" id="catView">
    <div class="cathead">
      <button class="backBtn" id="backBtn">←</button>
      <div class="titles"><h2 id="catTitle"></h2><div class="sub" id="catSub"></div></div>
    </div>
    <div class="budgetinfo" id="budgetInfo" style="display:none;">
      <div class="txt" id="budgetTxt"></div>
      <div class="bar" id="budgetBar"><div id="budgetFill" style="width:0%"></div></div>
    </div>
    <div class="page">
      <div class="searchbox"><input type="text" id="searchInput" placeholder="আইটেম দিয়ে খুঁজুন..."></div>
      <div class="toprow" id="topExpense"></div>

      <form id="entryForm">
        <div class="typetoggle">
          <button type="button" class="typebtn active" id="typeExpenseBtn">খরচ</button>
          <button type="button" class="typebtn" id="typeIncomeBtn">আয়</button>
        </div>
        <div class="field"><label for="itemName">আইটেমের নাম</label><input type="text" id="itemName" placeholder="যেমন: চাল" required></div>
        <div class="row2">
          <div class="field"><label for="subCat">সাব-ক্যাটাগরি (ঐচ্ছিক)</label><input type="text" id="subCat" placeholder="যেমন: বাজার"></div>
          <div class="field"><label for="qtyText">পরিমাণ (ঐচ্ছিক)</label><input type="text" id="qtyText" placeholder="যেমন: ১ কেজি"></div>
        </div>
        <div class="field"><label for="amount">টাকা</label><input type="number" id="amount" step="any" min="0" placeholder="০" required></div>
        <div class="row2">
          <button type="submit" class="add" id="submitBtn">খাতায় যোগ করুন</button>
          <button type="button" class="cancelEdit" id="cancelEditBtn" style="display:none;">বাতিল</button>
        </div>
      </form>

      <div class="entries" id="entries"></div>
      <div class="empty" id="emptyMsg">এখনও কোনো এন্ট্রি নেই — প্রথমটা যোগ করুন</div>
    </div>
    <div class="grand-total"><span class="label">এই মাসের মোট (এই খাতা)</span><span class="value" id="grandTotal">৳ ০</span></div>
  </div>

</div>

<script>
  const DEFAULT_CATEGORIES = [
    {id:'shongshar', name:'সংসারের দৈনন্দিন খরচ', desc:'বাজার, কাপড়, বিবিধ', color:'#A9762F', budget:null},
    {id:'basha', name:'বাসা ভাড়া ও বিল', desc:'ভাড়া, গ্যাস, বিদ্যুৎ, ইন্টারনেট', color:'#2B5D63', budget:null},
    {id:'transport', name:'যাতায়াত খরচ', desc:'অটো, রিকশা, বাস', color:'#35507A', budget:null},
    {id:'dokan', name:'দোকান / ব্যবসার হিসাব', desc:'কেনা-বেচার হিসাব', color:'#2F6B4F', budget:null},
    {id:'dhar', name:'ধার-দেনা', desc:'দিলাম বা পাওনা আছে', color:'#B23B3B', budget:null},
    {id:'bibidh', name:'বিবিধ', desc:'অন্য যেকোনো খরচ', color:'#6B4C6B', budget:null}
  ];
  const COLOR_OPTIONS = ['#A9762F','#2B5D63','#35507A','#2F6B4F','#B23B3B','#6B4C6B','#C77B3C','#4A6B8A','#8A4A6B','#5C8A4A'];

  function loadJSON(key, fallback){
    try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  let categories = loadJSON('hk_categories', DEFAULT_CATEGORIES);
  let entriesByCat = loadJSON('hk_entries', {});
  categories.forEach(c => { if(!entriesByCat[c.id]) entriesByCat[c.id] = []; });
  let scriptUrl = localStorage.getItem('hk_scriptUrl') || '';
  let darkMode = localStorage.getItem('hk_dark') === 'on';
  let currentCat = null;
  let editingEntryId = null;
  let currentType = 'expense';

  if(darkMode) document.body.classList.add('dark');

  const homeView = document.getElementById('homeView');
  const manageView = document.getElementById('manageView');
  const catView = document.getElementById('catView');
  const tabsList = document.getElementById('tabsList');
  const gearBtn = document.getElementById('gearBtn');
  const darkBtn = document.getElementById('darkBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const scriptUrlInput = document.getElementById('scriptUrl');
  const syncStatus = document.getElementById('syncStatus');
  const addCatBtn = document.getElementById('addCatBtn');
  const manageBackBtn = document.getElementById('manageBackBtn');
  const catList = document.getElementById('catList');
  const newCatName = document.getElementById('newCatName');
  const newCatBudget = document.getElementById('newCatBudget');
  const colorPicker = document.getElementById('colorPicker');
  const addCatSubmit = document.getElementById('addCatSubmit');
  let selectedColor = COLOR_OPTIONS[0];

  const backBtn = document.getElementById('backBtn');
  const catTitle = document.getElementById('catTitle');
  const catSub = document.getElementById('catSub');
  const budgetInfo = document.getElementById('budgetInfo');
  const budgetTxt = document.getElementById('budgetTxt');
  const budgetBar = document.getElementById('budgetBar');
  const budgetFill = document.getElementById('budgetFill');
  const searchInput = document.getElementById('searchInput');
  const topExpense = document.getElementById('topExpense');
  const form = document.getElementById('entryForm');
  const itemName = document.getElementById('itemName');
  const subCat = document.getElementById('subCat');
  const qtyText = document.getElementById('qtyText');
  const amount = document.getElementById('amount');
  const submitBtn = document.getElementById('submitBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const typeExpenseBtn = document.getElementById('typeExpenseBtn');
  const typeIncomeBtn = document.getElementById('typeIncomeBtn');
  const entriesEl = document.getElementById('entries');
  const emptyMsg = document.getElementById('emptyMsg');
  const grandTotalEl = document.getElementById('grandTotal');

  function fmt(n){ return '৳ ' + Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
  function allEntries(){ return Object.values(entriesByCat).flat(); }

  function showView(v){
    [homeView, manageView, catView].forEach(el => el.classList.remove('open'));
    v.classList.add('open');
  }

  function renderHomeSummary(){
    const nowM = todayISO().slice(0,7);
    const today = todayISO();
    let todayExp=0, monthExp=0, monthInc=0;
    allEntries().forEach(e => {
      if(e.type === 'income'){ if(monthKey(e.date)===nowM) monthInc += e.amount; }
      else{
        if(e.date === today) todayExp += e.amount;
        if(monthKey(e.date)===nowM) monthExp += e.amount;
      }
    });
    document.getElementById('todayTotal').textContent = fmt(todayExp);
    document.getElementById('monthTotal').textContent = fmt(monthExp);
    document.getElementById('monthIncome').textContent = fmt(monthInc);
    const net = monthInc - monthExp;
    const netEl = document.getElementById('netSavings');
    netEl.textContent = (net<0?'-':'')+fmt(Math.abs(net));
    netEl.className = 'val ' + (net>=0?'pos':'neg');
  }

  function catMonthTotal(catId){
    const nowM = todayISO().slice(0,7);
    return (entriesByCat[catId]||[]).filter(e=>e.type!=='income' && monthKey(e.date)===nowM).reduce((s,e)=>s+e.amount,0);
  }

  function renderTabs(){
    tabsList.innerHTML = '';
    categories.forEach(c => {
      const total = catMonthTotal(c.id);
      const btn = document.createElement('button');
      btn.className = 'tab';
      let barHtml = '';
      if(c.budget){
        const pct = Math.min(100, (total/c.budget)*100);
        barHtml = `<div class="budgetbar ${total>c.budget?'over':''}"><div style="width:${pct}%"></div></div>`;
      }
      btn.innerHTML = `
        <span class="sum">${total ? fmt(total) : ''}</span>
        <span class="info">
          <span class="name">${c.name}</span>
          <span class="desc">${c.desc||''}</span>
          ${barHtml}
        </span>
        <span class="swatch" style="background:${c.color}"></span>
      `;
      btn.addEventListener('click', () => openCategory(c.id));
      tabsList.appendChild(btn);
    });
    renderHomeSummary();
  }

  gearBtn.addEventListener('click', () => settingsPanel.classList.toggle('open'));
  darkBtn.addEventListener('click', () => {
    darkMode = !darkMode;
    document.body.classList.toggle('dark', darkMode);
    localStorage.setItem('hk_dark', darkMode?'on':'off');
  });
  if(scriptUrl){
    scriptUrlInput.value = scriptUrl;
    syncStatus.textContent = '● সিঙ্ক চালু আছে';
    syncStatus.className = 'status ok';
  }
  scriptUrlInput.addEventListener('input', () => {
    scriptUrl = scriptUrlInput.value.trim();
    localStorage.setItem('hk_scriptUrl', scriptUrl);
    if(scriptUrl){ syncStatus.textContent='● সিঙ্ক চালু আছে'; syncStatus.className='status ok'; }
    else{ syncStatus.textContent='● সিঙ্ক বন্ধ আছে'; syncStatus.className='status off'; }
  });

  // ---- MANAGE CATEGORIES ----
  function renderColorPicker(){
    colorPicker.innerHTML = '';
    COLOR_OPTIONS.forEach(col => {
      const d = document.createElement('div');
      d.className = 'colordot' + (col===selectedColor?' sel':'');
      d.style.background = col;
      d.addEventListener('click', () => { selectedColor = col; renderColorPicker(); });
      colorPicker.appendChild(d);
    });
  }
  function renderCatList(){
    catList.innerHTML = '';
    categories.forEach(c => {
      const row = document.createElement('div');
      row.className = 'catrow';
      row.innerHTML = `
        <span class="sw" style="background:${c.color}"></span>
        <span class="nm">${c.name}</span>
        <span class="bud">${c.budget ? 'বাজেট: '+fmt(c.budget) : ''}</span>
        <button class="delbtn" data-id="${c.id}">🗑</button>
      `;
      row.querySelector('.delbtn').addEventListener('click', () => {
        if(confirm(`"${c.name}" ক্যাটাগরি ও এর সব এন্ট্রি মুছে ফেলতে চান?`)){
          categories = categories.filter(x => x.id !== c.id);
          delete entriesByCat[c.id];
          saveJSON('hk_categories', categories);
          saveJSON('hk_entries', entriesByCat);
          renderCatList();
        }
      });
      catList.appendChild(row);
    });
  }
  addCatBtn.addEventListener('click', () => { renderCatList(); renderColorPicker(); showView(manageView); });
  manageBackBtn.addEventListener('click', () => { showView(homeView); renderTabs(); });
  addCatSubmit.addEventListener('click', () => {
    const name = newCatName.value.trim();
    if(!name) return;
    const budget = newCatBudget.value ? parseFloat(newCatBudget.value) : null;
    const id = 'c' + Date.now();
    categories.push({id, name, desc:'', color:selectedColor, budget});
    entriesByCat[id] = [];
    saveJSON('hk_categories', categories);
    saveJSON('hk_entries', entriesByCat);
    newCatName.value=''; newCatBudget.value='';
    renderCatList();
  });

  // ---- CATEGORY PAGE ----
  function openCategory(id){
    currentCat = categories.find(c => c.id === id);
    catTitle.textContent = currentCat.name;
    catSub.textContent = currentCat.desc || '';
    resetForm();
    searchInput.value = '';
    showView(catView);
    renderEntries();
  }
  backBtn.addEventListener('click', () => { showView(homeView); renderTabs(); });

  typeExpenseBtn.addEventListener('click', () => { currentType='expense'; typeExpenseBtn.classList.add('active'); typeIncomeBtn.classList.remove('active'); });
  typeIncomeBtn.addEventListener('click', () => { currentType='income'; typeIncomeBtn.classList.add('active'); typeExpenseBtn.classList.remove('active'); });

  function resetForm(){
    form.reset(); editingEntryId = null;
    submitBtn.textContent = 'খাতায় যোগ করুন';
    cancelEditBtn.style.display = 'none';
    currentType = 'expense'; typeExpenseBtn.classList.add('active'); typeIncomeBtn.classList.remove('active');
  }
  cancelEditBtn.addEventListener('click', resetForm);
  searchInput.addEventListener('input', renderEntries);

  function updateBudgetInfo(){
    const total = catMonthTotal(currentCat.id);
    if(currentCat.budget){
      budgetInfo.style.display = 'block';
      const pct = Math.min(100, (total/currentCat.budget)*100);
      budgetFill.style.width = pct + '%';
      budgetBar.className = 'bar' + (total>currentCat.budget ? ' over':'');
      budgetTxt.innerHTML = total>currentCat.budget
        ? `<span class="warn">⚠ বাজেট (${fmt(currentCat.budget)}) ছাড়িয়ে গেছে!</span> খরচ হয়েছে ${fmt(total)}`
        : `এই মাসে খরচ ${fmt(total)} / বাজেট ${fmt(currentCat.budget)}`;
    } else {
      budgetInfo.style.display = 'none';
    }
  }

  function renderEntries(){
    const q = searchInput.value.trim().toLowerCase();
    const list = (entriesByCat[currentCat.id]||[]).filter(e => !q || e.item.toLowerCase().includes(q));
    entriesEl.innerHTML = '';
    emptyMsg.style.display = list.length ? 'none' : 'block';
    list.slice().reverse().forEach(e => entriesEl.appendChild(entryRow(e)));

    const nowM = todayISO().slice(0,7);
    const monthList = (entriesByCat[currentCat.id]||[]).filter(e=>e.type!=='income' && monthKey(e.date)===nowM);
    grandTotalEl.textContent = fmt(monthList.reduce((s,e)=>s+e.amount,0));

    if(monthList.length){
      const top = monthList.reduce((a,b)=> b.amount>a.amount?b:a);
      topExpense.textContent = `📌 এই মাসে সবচেয়ে বেশি খরচ: ${top.item} (${fmt(top.amount)})`;
    } else { topExpense.textContent = ''; }

    updateBudgetInfo();
  }

  function entryRow(e){
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <div class="name">${e.item}${e.type==='income'?'<span class="type-in">আয়</span>':''}${(e.sub||e.qty) ? `<span class="qty">${[e.sub,e.qty].filter(Boolean).join(' · ')}</span>` : ''}</div>
      <div class="amt ${e.type==='income'?'income':''}">${fmt(e.amount)}</div>
      <div class="actions">
        <button data-act="edit" data-id="${e.id}">✏️</button>
        <button data-act="del" data-id="${e.id}">🗑</button>
      </div>
      <div class="sync-mark ${e.synced===null?'pending':(e.synced?'ok':'fail')}" id="mark-${e.id}">
        ${e.synced===null ? (scriptUrl?'○ পাঠানো হচ্ছে...':'○ শুধু এই খাতায়') : (e.synced?'✓ শিটে পাঠানো হয়েছে':'✕ পাঠানো যায়নি')}
      </div>
    `;
    row.querySelector('[data-act="edit"]').addEventListener('click', () => startEdit(e.id));
    row.querySelector('[data-act="del"]').addEventListener('click', () => deleteEntry(e.id));
    return row;
  }

  function startEdit(id){
    const e = entriesByCat[currentCat.id].find(x=>x.id===id);
    if(!e) return;
    editingEntryId = id;
    itemName.value = e.item; subCat.value = e.sub||''; qtyText.value = e.qty||''; amount.value = e.amount;
    currentType = e.type||'expense';
    typeExpenseBtn.classList.toggle('active', currentType==='expense');
    typeIncomeBtn.classList.toggle('active', currentType==='income');
    submitBtn.textContent = 'আপডেট করুন';
    cancelEditBtn.style.display = 'block';
    itemName.focus();
  }

  function deleteEntry(id){
    if(!confirm('এন্ট্রিটা মুছে ফেলতে চান?')) return;
    entriesByCat[currentCat.id] = entriesByCat[currentCat.id].filter(x=>x.id!==id);
    saveJSON('hk_entries', entriesByCat);
    renderEntries();
    sendToSheet({action:'delete', id});
  }

  function markSync(id, ok){
    const list = entriesByCat[currentCat.id];
    const e = list && list.find(x=>x.id===id);
    if(e) e.synced = ok;
    saveJSON('hk_entries', entriesByCat);
    const el = document.getElementById('mark-'+id);
    if(!el) return;
    if(ok){ el.textContent='✓ শিটে পাঠানো হয়েছে'; el.className='sync-mark ok'; }
    else{ el.textContent='✕ পাঠানো যায়নি'; el.className='sync-mark fail'; }
  }

  async function sendToSheet(payload){
    if(!scriptUrl) return;
    try{
      await fetch(scriptUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload) });
      if(payload.id && payload.action==='add') markSync(payload.id, true);
    } catch(err){ if(payload.id) markSync(payload.id, false); }
  }

  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const name = itemName.value.trim();
    const amt = parseFloat(amount.value);
    if(!name || isNaN(amt)) return;

    if(editingEntryId){
      const e = entriesByCat[currentCat.id].find(x=>x.id===editingEntryId);
      if(e){
        e.item=name; e.sub=subCat.value.trim(); e.qty=qtyText.value.trim(); e.amount=amt; e.type=currentType;
        saveJSON('hk_entries', entriesByCat);
        sendToSheet({action:'edit', id:e.id, date:e.date, type:e.type, category:currentCat.name, item:e.item, subcategory:e.sub, quantity:e.qty, amount:e.amount});
      }
    } else {
      const entry = {id:'e'+Date.now(), date:todayISO(), type:currentType, item:name, sub:subCat.value.trim(), qty:qtyText.value.trim(), amount:amt, synced:null};
      entriesByCat[currentCat.id].push(entry);
      saveJSON('hk_entries', entriesByCat);
      sendToSheet({action:'add', id:entry.id, date:entry.date, type:entry.type, category:currentCat.name, item:entry.item, subcategory:entry.sub, quantity:entry.qty, amount:entry.amount});
    }
    resetForm();
    renderEntries();
    itemName.focus();
  });

  renderTabs();
</script>
</body>
  </html>
